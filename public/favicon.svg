<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- FaceID Scan Target Corners -->
  <path d="M14 22 V 16 A 2 2 0 0 1 16 14 H 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42 14 H 48 A 2 2 0 0 1 50 16 V 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 42 V 48 A 2 2 0 0 1 48 50 H 42" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M22 50 H 16 A 2 2 0 0 1 14 48 V 42" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Face / Time Clock Icon in Center -->
  <!-- Clock Circle -->
  <circle cx="32" cy="32" r="12" stroke="url(#accentGrad)" stroke-width="2.2" fill="#090d16" fill-opacity="0.6"/>
  <!-- Clock Hands -->
  <path d="M32 24 V 32 L 37 35" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="1.8" fill="#14b8a6"/>

  <!-- Small biometric scan bar -->
  <line x1="20" y1="32" x2="44" y2="32" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4"/>
</svg>
